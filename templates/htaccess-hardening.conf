# Smile Creative — standard hardening block.
# Goes ABOVE the "# BEGIN WordPress" markers. WordPress rewrites only what is
# between its own markers, so anything above this survives a permalink save.

Options -Indexes

<Files xmlrpc.php>
Order Deny,Allow
Deny from all
</Files>

<Files wp-config.php>
Order Allow,Deny
Deny from all
</Files>

<FilesMatch "^(readme\.html|license\.txt|wp-config-sample\.php)$">
Order Allow,Deny
Deny from all
</FilesMatch>

# Security headers go in BOTH places, and this is not belt-and-braces.
#
# On a LiteSpeed site a cached page is served straight off disk without PHP
# running, so headers set by the mu-plugin appear only on a cache MISS. Verified
# on smilecreative.agency: a fresh URL had all five, the cached homepage had
# none, and the checker was right to fail it. The mu-plugin keeps the policy
# with the site through a migration; these lines make sure cached responses
# carry it too.
<IfModule mod_headers.c>
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "geolocation=(), camera=(), microphone=()"
Header always set Strict-Transport-Security "max-age=31536000"
Header always unset X-Pingback
</IfModule>

# On a CloudLinux/LiteSpeed box where the account default PHP is old, pin the
# version per site with (adjust the number):
# AddHandler application/x-httpd-alt-php83___lsphp .php
