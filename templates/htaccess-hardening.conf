# Smile Creative — standard hardening block.
# Goes ABOVE the "# BEGIN WordPress" markers. WordPress rewrites only what is
# between its own markers, so anything above this survives a permalink save.

Options -Indexes

<Files xmlrpc.php>
Order Deny,Allow
Deny from all
</Files>

<Files wp-config.php>
Order Allow,Deny
Deny from all
</Files>

<FilesMatch "^(readme\.html|license\.txt|wp-config-sample\.php)$">
Order Allow,Deny
Deny from all
</FilesMatch>

# Security headers live in mu-plugins/smile-security-headers.php instead of
# here, so they travel with the site through a migration and cannot be lost
# when a plugin rewrites .htaccess.

# On a CloudLinux/LiteSpeed box where the account default PHP is old, pin the
# version per site with (adjust the number):
# AddHandler application/x-httpd-alt-php83___lsphp .php
